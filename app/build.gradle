plugins {
    id 'com.android.application'
}
android {
    namespace 'br.com.arca.offline'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'br.com.arca.offline'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '0.3.0'
        testInstrumentationRunner 'br.com.arca.offline.ArcaSmokeInstrumentation'
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

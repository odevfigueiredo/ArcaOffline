name: Compilar APK de testes

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - name: Buscar código
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Validar e preparar Gradle Wrapper
        uses: gradle/actions/setup-gradle@v4

      - name: Instalar plataforma Android 35
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Verificar criptografia, armazenamento e certificados
        run: |
          mkdir -p build/checks
          javac --release 17 -encoding UTF-8 -d build/checks \
            app/src/main/java/br/com/arca/offline/CryptoBox.java \
            app/src/main/java/br/com/arca/offline/LanCertificates.java \
            app/src/main/java/br/com/arca/offline/VaultStorage.java \
            tests/CryptoBoxTest.java tests/LanCertificatesTest.java tests/VaultStorageTest.java
          java -cp build/checks CryptoBoxTest
          java -cp build/checks br.com.arca.offline.LanCertificatesTest
          java -cp build/checks br.com.arca.offline.VaultStorageTest

      - name: Compilar e verificar APK
        run: bash ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug

      - name: Conferir assinatura e permissões do APK
        run: |
          apk=app/build/outputs/apk/debug/app-debug.apk
          tools="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools/35.0.0"
          "$tools/apksigner" verify "$apk"
          permissions=$("$tools/aapt2" dump permissions "$apk")
          printf '%s\n' "$permissions"
          actual=$(sed -n "s/^uses-permission: name='\([^']*\)'.*$/\1/p" <<< "$permissions" | sort)
          expected=$(printf '%s\n' android.permission.ACCESS_NETWORK_STATE android.permission.INTERNET)
          if [[ "$actual" != "$expected" ]]; then
            echo 'Falha: permissões do APK divergiram do acesso local previsto.' >&2
            exit 1
          fi

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: arca-offline-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
